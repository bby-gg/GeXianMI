server:
  port: 8000

gexianmi:
  # 传感器数据上报接口的共享密钥，模拟器/真实传感器上报时需在请求头 X-Api-Key 中携带
  sensor-api-key: "gxm-sensor-2026"

spring:
  application:
    name: gexianmi-backend
  datasource:
    url: jdbc:mysql://localhost:3306/gexianmi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 3523048584
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

mybatis-plus:
  configuration:
    # 数据库下划线命名 → Java 驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，上线改为 false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gexianmi: debug
